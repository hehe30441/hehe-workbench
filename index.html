<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="贺贺工作台">
<meta name="theme-color" content="#5F7A5A">
<meta name="description" content="贺贺的个人生活工作台 - 10 个私密生活记录板块，手机加主屏幕即可当 App 使用">
<title>贺贺工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png" sizes="512x512">
<link rel="icon" href="icon.png" sizes="512x512">
<style>
:root{
  --primary:#7A9B6E;
  --primary-dark:#5F7A5A;
  --primary-deep:#46593F;
  --primary-soft:#E8EEE4;
  --accent:#C9A86A;
  --accent-soft:#F3EAD6;
  --paper:#FBF7F1;
  --card:#FFFFFF;
  --ink:#3A3A36;
  --muted:#8A8A82;
  --line:#ECE7DD;
  --danger:#C77A6B;
  --shadow:0 6px 22px rgba(70,89,63,.12);
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Segoe UI",sans-serif;
  background:var(--paper);color:var(--ink);
  font-size:15px;line-height:1.5;overscroll-behavior-y:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block;max-width:100%}

/* ===== 布局 ===== */
.app{display:flex;min-height:100vh;min-height:100dvh}

/* ===== 侧边栏 ===== */
.sidebar{
  width:232px;flex:0 0 232px;
  background:linear-gradient(180deg,#6E8C63 0%,#576F4F 100%);
  color:#F1F5EC;display:flex;flex-direction:column;
  padding:22px 14px;position:sticky;top:0;height:100vh;height:100dvh;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);
  display:grid;place-items:center;font-size:20px;flex:0 0 38px}
.brand .name{font-size:17px;font-weight:700;letter-spacing:.5px}
.brand .sub{font-size:11px;opacity:.72;font-weight:400}
.nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1;margin:6px -4px 0;padding:0 4px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;
  font-size:14.5px;color:#E7EFE0;text-align:left;transition:.18s;position:relative;
}
.nav-item .em{font-size:18px;width:22px;text-align:center;flex:0 0 22px}
.nav-item .ct{margin-left:auto;font-size:11px;background:rgba(255,255,255,.16);
  padding:1px 8px;border-radius:20px;min-width:20px;text-align:center}
.nav-item:hover{background:rgba(255,255,255,.10)}
.nav-item.active{background:rgba(255,255,255,.20);color:#fff;font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-4px;top:50%;transform:translateY(-50%);
  width:4px;height:20px;border-radius:4px;background:var(--accent)}
.side-foot{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);
  font-size:11.5px;opacity:.8;line-height:1.7}
.side-foot b{color:var(--accent-soft)}
.side-foot .set{display:inline-flex;align-items:center;gap:6px;margin-top:8px;
  padding:7px 12px;border-radius:10px;background:rgba(255,255,255,.14);font-size:12.5px}

/* ===== 主区 ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(90deg,#6E8C63,#7A9B6E);
  color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;
  box-shadow:0 2px 14px rgba(70,89,63,.18);
}
.hamb{display:none;font-size:22px;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16)}
.top-title{font-size:17px;font-weight:700}
.top-sub{font-size:12.5px;opacity:.85;margin-top:1px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.top-date{font-size:13px;opacity:.92;text-align:right;line-height:1.35}
.top-date b{font-size:14px}

.content{flex:1;overflow-y:auto;padding:20px;max-width:1080px;width:100%;margin:0 auto}
.view{display:none;animation:fade .25s ease}
.view.show{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== 首页：欢迎卡 ===== */
.welcome{
  background:linear-gradient(120deg,#7A9B6E,#A7BE8E 70%,#C9A86A);
  color:#fff;border-radius:20px;padding:22px 24px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;margin-bottom:18px;
}
.welcome::after{content:"🌿";position:absolute;right:14px;bottom:-12px;font-size:90px;opacity:.18}
.welcome .hi{font-size:13px;opacity:.92;letter-spacing:1px}
.welcome h1{margin:6px 0 8px;font-size:24px;font-weight:800}
.welcome p{margin:0;opacity:.92;font-size:13.5px;max-width:80%}
.welcome .stat{display:flex;gap:22px;margin-top:16px}
.welcome .stat div{font-size:12.5px;opacity:.9}
.welcome .stat b{display:block;font-size:22px;font-weight:800;margin-bottom:2px}

/* ===== 今日提醒 ===== */
.sec-title{display:flex;align-items:center;gap:9px;margin:6px 2px 14px;font-size:16px;font-weight:700}
.sec-title .bar{width:4px;height:17px;border-radius:4px;background:var(--primary)}
.reminders{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:22px}
.reminder{
  background:var(--card);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow);
  border-left:4px solid var(--primary);display:flex;gap:12px;align-items:flex-start;
}
.reminder.warn{border-left-color:var(--danger)}
.reminder .ic{font-size:22px;flex:0 0 26px}
.reminder .rt{font-size:14px;font-weight:600}
.reminder .rd{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.reminder.empty{grid-column:1/-1;color:var(--muted);justify-content:center;border-left-color:var(--line)}

/* ===== 板块网格 ===== */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{
  background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:8px;transition:.18s;border:1px solid var(--line);text-align:left;
}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(70,89,63,.18)}
.tile .top{display:flex;align-items:center;gap:11px}
.tile .emo{width:42px;height:42px;border-radius:12px;background:var(--primary-soft);
  display:grid;place-items:center;font-size:22px;flex:0 0 42px}
.tile .nm{font-size:15px;font-weight:700}
.tile .ds{font-size:11.5px;color:var(--muted);line-height:1.45}
.tile .meta{display:flex;align-items:center;justify-content:space-between;margin-top:4px;
  font-size:12px;color:var(--muted)}
.tile .cnt{background:var(--primary-soft);color:var(--primary-dark);padding:2px 10px;border-radius:20px;font-weight:600}
.tile .go{color:var(--primary);font-weight:600}

/* ===== 板块列表视图 ===== */
.page-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.page-head .emo{width:52px;height:52px;border-radius:14px;background:var(--primary-soft);
  display:grid;place-items:center;font-size:28px;flex:0 0 52px}
.page-head h2{margin:0;font-size:21px}
.page-head .ds{font-size:12.5px;color:var(--muted);margin-top:2px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 14px}
.chip{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);
  font-size:13px;color:var(--muted);transition:.15s}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px}
.rec{background:var(--card);border-radius:15px;box-shadow:var(--shadow);overflow:hidden;
  border:1px solid var(--line);cursor:pointer;transition:.16s;text-align:left;display:flex;flex-direction:column}
.rec:hover{transform:translateY(-2px)}
.rec .thumb{height:120px;background:var(--primary-soft);background-size:cover;background-position:center;
  display:grid;place-items:center;font-size:34px;color:var(--primary)}
.rec .body{padding:12px 13px;flex:1;display:flex;flex-direction:column}
.rec .ttl{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .snip{font-size:12.5px;color:var(--muted);margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.rec .ft{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.rec .ft .lk{background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:20px}
.rec .ft .dt{margin-left:auto}
.empty-state{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}
.empty-state .big{font-size:46px;margin-bottom:10px}

/* ===== 悬浮加号 ===== */
.fab{
  position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;
  background:var(--primary);color:#fff;font-size:30px;box-shadow:0 8px 24px rgba(70,89,63,.4);
  display:grid;place-items:center;z-index:30;transition:.18s;
}
.fab:active{transform:scale(.92)}

/* ===== 遮罩与底部弹窗 ===== */
.mask{position:fixed;inset:0;background:rgba(40,50,38,.42);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);
  border-radius:22px 22px 0 0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:.28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 30px rgba(0,0,0,.2);
}
.sheet.show{transform:none}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2}
.sheet-head .em{font-size:22px}
.sheet-head h3{margin:0;font-size:17px;flex:1}
.sheet-head .x{font-size:24px;width:36px;height:36px;border-radius:10px;background:var(--primary-soft);color:var(--primary-dark)}
.sheet-body{padding:14px 18px 22px;overflow-y:auto;flex:1}
.sheet-foot{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.btn{flex:1;padding:13px;border-radius:13px;font-size:15px;font-weight:600;text-align:center;transition:.15s}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:active{filter:brightness(.94)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}

/* ===== 表单 ===== */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
.field label .req{color:var(--danger)}
.field input[type=text],.field input[type=number],.field input[type=date],.field textarea,.field select{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;
  font-size:14.5px;color:var(--ink);font-family:inherit;outline:none;transition:.15s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.field textarea{resize:vertical;min-height:74px;line-height:1.55}
.img-add{display:flex;flex-wrap:wrap;gap:9px}
.img-add .ph{width:84px;height:84px;border-radius:12px;border:1.5px dashed var(--primary);
  display:grid;place-items:center;color:var(--primary);font-size:13px;background:var(--primary-soft);position:relative}
.img-add .ph input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.img-add .im{width:84px;height:84px;border-radius:12px;background-size:cover;background-position:center;position:relative}
.img-add .im .dl{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;
  background:var(--danger);color:#fff;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.stars{display:flex;gap:6px;font-size:26px;color:var(--accent)}
.stars span{cursor:pointer;opacity:.32;transition:.1s}
.stars span.on{opacity:1}
.link-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.link-chip{background:var(--accent-soft);color:var(--primary-dark);border-radius:20px;padding:5px 11px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.link-chip .x{color:var(--danger);font-weight:700}
.link-add{background:var(--primary-soft);color:var(--primary-dark);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600}

/* ===== 详情 ===== */
.detail-imgs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.detail-imgs img{width:96px;height:96px;border-radius:12px;object-fit:cover}
.detail-rows{display:flex;flex-direction:column;gap:0}
.detail-rows .r{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.detail-rows .r .k{color:var(--muted);flex:0 0 84px}
.detail-rows .r .v{flex:1;word-break:break-word}
.detail-rows .r .v.imgs{display:flex;gap:6px;flex-wrap:wrap}
.detail-rows .r .v.imgs img{width:64px;height:64px;border-radius:9px;object-fit:cover}
.detail-links{margin-top:10px}
.detail-links .lt{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.detail-links .lc{display:flex;gap:8px;flex-wrap:wrap}
.detail-links .lk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 11px;
  font-size:13px;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
.detail-links .lk .em{font-size:16px}
.detail-links .lk .ct{margin-left:auto;color:var(--muted);font-size:11px}
.detail-actions{display:flex;gap:10px;margin-top:16px}

/* ===== 选择器 ===== */
.picker-sec{margin-bottom:14px}
.picker-sec h4{margin:0 0 8px;font-size:13px;color:var(--muted)}
.picker-opts{display:flex;flex-wrap:wrap;gap:8px}
.picker-opt{padding:8px 13px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:13px}
.picker-opt.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.picker-list{display:flex;flex-direction:column;gap:7px;max-height:50vh;overflow-y:auto}
.picker-item{padding:11px 13px;border-radius:11px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;gap:10px;font-size:14px}
.picker-item .em{font-size:18px}
.picker-item.on{border-color:var(--primary);background:var(--primary-soft)}
.picker-item .ck{margin-left:auto;font-size:16px;color:var(--primary)}

/* ===== 设置 ===== */
.set-row{padding:14px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.set-row .em{font-size:22px}
.set-row .tx{flex:1}
.set-row .tx b{font-size:14.5px;display:block}
.set-row .tx small{color:var(--muted);font-size:12px}
.set-row .btn{flex:0 0 auto;padding:9px 16px;font-size:13.5px}

/* ===== 移动端抽屉 ===== */
@media(max-width:820px){
  .sidebar{position:fixed;left:0;top:0;z-index:45;transform:translateX(-100%);transition:.26s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .sidebar.open{transform:none}
  .hamb{display:grid;place-items:center}
  .top-title{font-size:16px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .content{padding:14px}
  .welcome p{max-width:100%}
}
@media(max-width:430px){
  .grid{grid-template-columns:1fr 1fr}
  .welcome h1{font-size:21px}
}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:44;opacity:0;pointer-events:none;transition:.2s}
.scrim.show{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
  background:var(--primary-deep);color:#fff;padding:11px 20px;border-radius:24px;font-size:13.5px;
  z-index:99;opacity:0;transition:.25s;box-shadow:0 6px 20px rgba(0,0,0,.3);pointer-events:none;max-width:86%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">🌿</div>
      <div>
        <div class="name">贺贺工作台</div>
        <div class="sub">生活记录 · 私人空间</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      手机「加主屏幕」<br>即可当 <b>App</b> 使用
      <button class="set" id="openSet">⚙️ 数据与备份</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- 主区 -->
  <main class="main">
    <header class="topbar">
      <button class="hamb" id="hamb">☰</button>
      <div>
        <div class="top-title" id="topTitle">总览</div>
        <div class="top-sub" id="topSub">今日生活速览</div>
      </div>
      <div class="top-right">
        <div class="top-date" id="topDate"></div>
      </div>
    </header>

    <div class="content">
      <!-- 首页视图 -->
      <section class="view show" id="view-home">
        <div class="welcome">
          <div class="hi" id="wHi">下午好</div>
          <h1 id="wName">贺贺，今天也好好生活 🌿</h1>
          <p id="wTip">记录微小而确定的快乐，让日常有迹可循。</p>
          <div class="stat">
            <div><b id="stTotal">0</b>条记录</div>
            <div><b id="stDays">0</b>天陪伴</div>
            <div><b id="stSec">10</b>个板块</div>
          </div>
        </div>

        <div class="sec-title"><span class="bar"></span>今日提醒</div>
        <div class="reminders" id="reminders"></div>

        <div class="sec-title"><span class="bar"></span>生活板块</div>
        <div class="grid" id="grid"></div>
      </section>

      <!-- 板块列表视图 -->
      <section class="view" id="view-section">
        <div class="page-head">
          <div class="emo" id="secEmo">📁</div>
          <div>
            <h2 id="secName">板块</h2>
            <div class="ds" id="secDesc"></div>
          </div>
        </div>
        <div class="filters" id="filters"></div>
        <div class="list" id="list"></div>
      </section>
    </div>

    <button class="fab" id="fab">＋</button>
  </main>
</div>

<!-- 遮罩 + 弹窗 -->
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <span class="em" id="sheetEm">📝</span>
    <h3 id="sheetTitle">编辑</h3>
    <button class="x" id="sheetClose">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot" id="sheetFoot"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== 板块配置 ===================== */
const SECTIONS = [
  { id:'wardrobe', name:'电子衣橱', em:'👗', desc:'记录每一件单品，按季节场合随手搭配。',
    fields:[
      {k:'name',l:'单品名称',t:'text',req:true},
      {k:'cat',l:'类别',t:'select',o:['上衣','裤子','裙装','外套','鞋履','配饰']},
      {k:'season',l:'季节',t:'select',o:['春','夏','秋','冬','四季']},
      {k:'color',l:'颜色',t:'text'},
      {k:'occasion',l:'适合场合',t:'text'},
      {k:'note',l:'备注',t:'textarea'},
      {k:'img',l:'单品照片',t:'image'}
    ],
    titleKey:'name', subKey:'cat', smart:'outfit' },

  { id:'plants', name:'绿植浇水', em:'🪴', desc:'记住每盆植物的浇水节奏，到期自动提醒。',
    fields:[
      {k:'name',l:'植物名称',t:'text',req:true},
      {k:'species',l:'品种',t:'text'},
      {k:'last',l:'上次浇水',t:'date'},
      {k:'interval',l:'浇水周期(天)',t:'number',def:7},
      {k:'light',l:'光照喜好',t:'select',o:['喜阴','半阴','喜阳']},

/* ===================== 存储 ===================== */
const KEY='hehe_records_v1';
let RECORDS = load();
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||[] }catch(e){ return [] } }
function save(){ localStorage.setItem(KEY, JSON.stringify(RECORDS)) }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7) }
function getBySec(id){ return RECORDS.filter(r=>r.section===id) }
function getRec(id){ return RECORDS.find(r=>r.id===id) }
function daysAgo(d){ const t=(Date.now()-new Date(d).getTime())/864e5; return Math.floor(t) }
function fmtDate(d){ if(!d)return''; const x=new Date(d); return (x.getMonth()+1)+'月'+x.getDate()+'日' }

/* ===================== 图片压缩 ===================== */
function compressImage(file){
  return new Promise((res)=>{
    if(!file){res(null);return}
    const r=new FileReader();
    r.onload=()=>{ const img=new Image();
      img.onload=()=>{ let w=img.width,h=img.height,max=1000;
        if(w>max||h>max){const r2=Math.min(max/w,max/h);w=Math.round(w*r2);h=Math.round(h*r2);}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',0.72)); };
      img.onerror=()=>res(null); img.src=r.result; };
    r.onerror=()=>res(null); r.readAsDataURL(file);
  });
}

/* ===================== 今日提醒 ===================== */
function renderReminders(){
  const box=document.getElementById('reminders');
  const items=[];
  const today=new Date(); today.setHours(0,0,0,0);

  // 1) 绿植浇水
  const plants=getBySec('plants');
  let due=0;
  plants.forEach(p=>{ if(p.f.last&&p.f.interval){ const nx=new Date(p.f.last); nx.setDate(nx.getDate()+ (+p.f.interval||7)); if(today>=nx) due++; }});
  if(due>0) items.push({ic:'🪴',warn:true,rt:`${due} 盆绿植该浇水了`,rd:'点开「绿植浇水」查看哪些需要照顾'});
  else if(plants.length) items.push({ic:'🪴',rt:'绿植都安好',rd:'暂无到期浇水任务，继续保持~'});

  // 2) 经期预测
  const body=getBySec('body').filter(r=>r.f.period==='开始').sort((a,b)=>new Date(a.f.date)-new Date(b.f.date));
  if(body.length){
    const last=new Date(body[body.length-1].f.date);
    const next=new Date(last); next.setDate(next.getDate()+28);
    const left=Math.round((next-today)/864e5);
    if(left>=0&&left<=3) items.push({ic:'🌿',warn:true,rt:`预计 ${left===0?'今天':left+' 天后'} 经期`,rd:'可在「体感实录」记录身体信号'});
  }

  // 3) 穿搭建议（天气，失败则季节）
  const w=window.__weather;
  let tip='根据天气选衣更舒服';
  if(w&&w.temp!=null){
    const t=w.temp;
    tip = t<10?'今天偏冷，记得外套叠穿': t<18?'微凉，长袖正合适': t<26?'舒爽，轻薄就好': '炎热，透气清凉优先';
    items.unshift({ic:'👗',rt:`今日 ${Math.round(t)}°C · 穿搭建议`,rd:tip});
  }else{
    const m=new Date().getMonth();
    const season = m>=2&&m<=4?'春': m>=5&&m<=7?'夏': m>=8&&m<=10?'秋':'冬';
    items.push({ic:'👗',rt:`${season}季穿搭`,rd:'开启定位可获取实时天气穿搭建议'});
  }

  // 4) 连续记录/鼓励
  if(total===0) items.push({ic:'🌱',rt:'开启你的第一行记录',rd:'从任意板块点右下角 ＋ 开始'});

  if(!items.length){ box.innerHTML='<div class="reminder empty">今天一切安好，没有待办提醒 🌿</div>'; return; }
  box.innerHTML=items.map(it=>`
    <div class="reminder ${it.warn?'warn':''}">
      <div class="ic">${it.ic}</div>
      <div><div class="rt">${it.rt}</div><div class="rd">${it.rd}</div></div>
    </div>`).join('');
}

let editState={sec:null,id:null,img:[],stars:{},links:[]};
function openEditor(secId, recId){
  const s=SEC_MAP[secId];
  editState={sec:secId,id:recId,img:[],stars:{},links:[]};
  let rec=recId?getRec(recId):null;
  if(rec){ editState.img=rec.img?rec.img.slice():[]; editState.links=rec.links?rec.links.slice():[];
    s.fields.forEach(f=>{ if(f.t==='rating') editState.stars[f.k]=rec.f[f.k]||0; }); }
  document.getElementById('sheetEm').textContent=s.em;
  document.getElementById('sheetTitle').textContent=(recId?'编辑':'新建')+' · '+s.name;
  const body=document.getElementById('sheetBody');
  body.innerHTML=s.fields.map(f=>fieldHTML(f,rec)).join('')
    + `<div class="field"><label>关联其他记录</label><div class="link-row" id="linkRow"></div>
       <button class="link-add" id="addLink">＋ 关联</button></div>`;
  // 绑定
  s.fields.forEach(f=>bindField(f));
  renderLinkRow();
  document.getElementById('addLink').onclick=openLinkPicker;
  document.getElementById('sheetFoot').innerHTML=
    `<button class="btn ghost" id="delBtn" ${recId?'':'style="display:none"'} >删除</button>
     <button class="btn primary" id="saveBtn">保存</button>`;
  document.getElementById('saveBtn').onclick=()=>saveRecord();
  const del=document.getElementById('delBtn'); if(del) del.onclick=()=>deleteRecord();
  openSheet();
}
function fieldHTML(f,rec){
  const v=rec?rec.f[f.k]:'';
  if(f.t==='textarea') return `<div class="field"><label>${f.l}${f.req?'<span class="req">*</span>':''}</label><textarea data-k="${f.k}" placeholder="写点什么…">${esc(v||'')}</textarea></div>`;
  if(f.t==='select') return `<div class="field"><label>${f.l}</label><select data-k="${f.k}">${(['',...f.o]).map(o=>`<option value="${o}" ${v===o?'selected':''}>${o||'请选择'}</option>`).join('')}</select></div>`;
  if(f.t==='date') return `<div class="field"><label>${f.l}</label><input type="date" data-k="${f.k}" value="${v||''}"></div>`;
  if(f.t==='number') return `<div class="field"><label>${f.l}</label><input type="number" data-k="${f.k}" value="${v||''}" placeholder="0"></div>`;
  if(f.t==='rating') return `<div class="field"><label>${f.l}</label><div class="stars" data-k="${f.k}">${[1,2,3,4,5].map(n=>`<span data-n="${n}" class="${editState.stars[f.k]>=n?'on':''}">★</span>`).join('')}</div></div>`;
  if(f.t==='image') return `<div class="field"><label>${f.l}</label><div class="img-add" id="imgAdd"></div></div>`;
  return `<div class="field"><label>${f.l}${f.req?'<span class="req">*</span>':''}</label><input type="text" data-k="${f.k}" value="${esc(v||'')}" placeholder="…"></div>`;
}
function bindField(f){
  const s=SEC_MAP[editState.sec];
  if(f.t==='rating'){
    const box=document.querySelector(`.stars[data-k="${f.k}"]`);
    box.querySelectorAll('span').forEach(sp=>sp.onclick=()=>{ const n=+sp.dataset.n; editState.stars[f.k]=n;
      box.querySelectorAll('span').forEach(x=>x.classList.toggle('on',+x.dataset.n<=n)); });
  }
  if(f.t==='image'){ renderImgAdd(); }
}
function renderImgAdd(){
  const box=document.getElementById('imgAdd'); if(!box)return;
  box.innerHTML=editState.img.map((src,i)=>`<div class="im" style="background-image:url(${src})"><div class="dl" data-i="${i}">✕</div></div>`).join('')
    + `<label class="ph">＋<input type="file" accept="image/*" id="imgIn"></label>`;
  box.querySelectorAll('.dl').forEach(d=>d.onclick=()=>{ editState.img.splice(+d.dataset.i,1); renderImgAdd(); });
  const inp=document.getElementById('imgIn');
  if(inp) inp.onchange=async e=>{ const f=e.target.files[0]; if(!f)return;
    const d=await compressImage(f); if(d) editState.img.push(d); renderImgAdd(); };
}
function renderLinkRow(){
  const row=document.getElementById('linkRow'); if(!row)return;
  row.innerHTML=editState.links.map((lk,i)=>{ const s=SEC_MAP[lk.section]; const r=getRec(lk.id);
    const t=r? (r.f[s.titleKey]||'(未命名)') : '(已删)';
    return `<span class="link-chip">${s.em} ${esc(t)}<span class="x" data-i="${i}">✕</span></span>`; }).join('');
  row.querySelectorAll('.x').forEach(x=>x.onclick=()=>{ editState.links.splice(+x.dataset.i,1); renderLinkRow(); });
}

function saveRecord(){
  const s=SEC_MAP[editState.sec];
  const f={};
  let ok=true, miss='';
  s.fields.forEach(fd=>{
    if(fd.t==='rating'){ f[fd.k]=editState.stars[fd.k]||0; return; }
    if(fd.t==='image') return;
    const el=document.querySelector(`[data-k="${fd.k}"]`);
    const v=el?el.value.trim():'';
    f[fd.k]=v;
    if(fd.req&&!v){ ok=false; miss=fd.l; }
  });
  if(!ok){ toast('请填写：'+miss); return; }
  const now=Date.now();
  if(editState.id){ const r=getRec(editState.id); r.f=f; r.img=editState.img; r.links=editState.links; r.updated=now; }
  else{ RECORDS.push({id:uid(),section:editState.sec,created:now,updated:now,f,img:editState.img,links:editState.links}); }
  save();
  closeSheet();
  toast('已保存 ✓');
  renderNav();
  if(curSec===editState.sec) renderList(); else if(document.getElementById('view-home').classList.contains('show')) renderHome();
}
function deleteRecord(){
  if(!editState.id)return;
  if(!confirm('确定删除这条记录？'))return;
  RECORDS=RECORDS.filter(r=>r.id!==editState.id);
  save(); closeSheet(); toast('已删除');
  renderNav();
  if(curSec) renderList(); else renderHome();
}

    +secs.map(s=>`<button class="picker-opt ${pickerState.sec===s.id?'on':''}" data-ps="${s.id}">${s.em} ${s.name}</button>`).join('')
    +`</div></div><div class="picker-list" id="pickerList"></div>`;
  body.innerHTML=html;
  body.querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>{pickerState.sec=b.dataset.ps;renderPicker();});
  let arr=RECORDS.slice().sort((a,b)=>new Date(b.updated)-new Date(a.updated));
  if(pickerState.sec!=='all') arr=arr.filter(r=>r.section===pickerState.sec);
  const list=body.querySelector('#pickerList');
  if(!arr.length){ list.innerHTML='<div style="color:var(--muted);padding:20px;text-align:center">暂无记录</div>'; }
  else list.innerHTML=arr.map(r=>{ const s=SEC_MAP[r.section]; const t=r.f[s.titleKey]||'(未命名)';
    const key=r.section+'#'+r.id; const on=pickerState.sel.has(key);
    return `<div class="picker-item ${on?'on':''}" data-key="${key}" data-sec="${r.section}" data-id="${r.id}">
      <span class="em">${s.em}</span><span>${esc(t)}</span><span class="ck">${on?'✓':''}</span></div>`; }).join('');
  list.querySelectorAll('.picker-item').forEach(it=>it.onclick=()=>{
    const key=it.dataset.key;
    if(pickerState.sel.has(key)) pickerState.sel.delete(key); else pickerState.sel.add(key);
    renderPicker();
  });
}
function bindPickerFoot(){
  document.getElementById('sheetFoot').innerHTML=`<button class="btn ghost" id="pkCancel">取消</button><button class="btn primary" id="pkOk">完成</button>`;
  document.getElementById('pkCancel').onclick=closeTempSheet;
  document.getElementById('pkOk').onclick=()=>{
    editState.links=[...pickerState.sel].map(k=>{ const [section,id]=k.split('#'); return {section,id}; });
    renderLinkRow(); closeTemp();
  };
}

/* ===================== 详情查看 ===================== */
function openViewer(id){
  const r=getRec(id); if(!r)return;
  const s=SEC_MAP[r.section];
  document.getElementById('sheetEm').textContent=s.em;
  document.getElementById('sheetTitle').textContent=s.name;
  const body=document.getElementById('sheetBody');
  const imgs=r.img&&r.img.length?`<div class="detail-imgs">${r.img.map(src=>`<img src="${src}">`).join('')}</div>`:'';
  const rows=s.fields.filter(f=>f.t!=='image').map(f=>{
    let v=r.f[f.k];
    if(f.t==='rating') v=v? '★'.repeat(v)+'☆'.repeat(5-v):'';
    if(!v) return '';
    return `<div class="r"><div class="k">${f.l}</div><div class="v">${esc(v)}</div></div>`;
  }).filter(Boolean).join('');
  // 关联
  let linksHTML='';
  if(r.links&&r.links.length){
    const chips=r.links.map(lk=>{ const s2=SEC_MAP[lk.section]; const r2=getRec(lk.id);
      if(!r2) return ''; const t=r2.f[s2.titleKey]||'(未命名)';
      return `<button class="lk" data-sec="${lk.section}" data-id="${lk.id}"><span class="em">${s2.em}</span>${esc(t)}<span class="ct">${s2.name}</span></button>`; }).filter(Boolean).join('');
    if(chips) linksHTML=`<div class="detail-links"><div class="lt">🔗 关联记录</div><div class="lc">${chips}</div></div>`;
  }
  body.innerHTML=imgs+`<div class="detail-rows">${rows}</div>`+linksHTML
    +`<div class="detail-actions"><button class="btn ghost" id="vEdit">编辑</button><button class="btn primary" id="vClose">关闭</button></div>`;
  body.querySelectorAll('.lk').forEach(b=>b.onclick=()=>openViewer(b.dataset.id));
  document.getElementById('vEdit').onclick=()=>openEditor(r.section,r.id);
  document.getElementById('vClose').onclick=closeSheet;
  document.getElementById('sheetFoot').innerHTML='';
  openSheet();
}

/* ===================== 设置 / 备份 ===================== */
function openSettings(){
  document.getElementById('sheetEm').textContent='⚙️';
  document.getElementById('sheetTitle').textContent='数据与备份';
  const body=document.getElementById('sheetBody');
  const size=(localStorage.getItem(KEY)?localStorage.getItem(KEY).length:0);
  body.innerHTML=`
    <div class="set-row"><span class="em">📦</span><div class="tx"><b>导出全部数据</b><small>下载为 JSON 文件，换手机也不丢</small></div><button class="btn primary" id="expBtn">导出</button></div>
    <div class="set-row"><span class="em">📥</span><div class="tx"><b>导入数据</b><small>从备份文件恢复（合并到现有）</small></div><button class="btn ghost" id="impBtn">导入</button></div>
    <div class="set-row"><span class="em">🧹</span><div class="tx"><b>清空全部记录</b><small>共 ${RECORDS.length} 条，约 ${(size/1024).toFixed(1)} KB</small></div><button class="btn ghost" id="clrBtn" style="color:var(--danger)">清空</button></div>
    <div class="set-row"><span class="em">📲</span><div class="tx"><b>当 App 使用</b><small>iOS：分享 → 添加到主屏幕；安卓：菜单 → 安装应用</small></div></div>`;
  document.getElementById('expBtn').onclick=exportData;
  document.getElementById('impBtn').onclick=importData;
  document.getElementById('clrBtn').onclick=clearAll;
  document.getElementById('sheetFoot').innerHTML='<button class="btn primary" id="setClose">关闭</button>';
  document.getElementById('setClose').onclick=closeSheet;
  openSheet();
}
function exportData(){
  const blob=new Blob([JSON.stringify(RECORDS,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='贺贺工作台备份_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  toast('已导出 ✓');
}
function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
  inp.onchange=async e=>{ const f=e.target.files[0]; if(!f)return;
    try{ const txt=await f.text(); const arr=JSON.parse(txt);
      if(!Array.isArray(arr))throw 0;
      const have=new Set(RECORDS.map(r=>r.id));
      let n=0; arr.forEach(r=>{ if(r&&r.id&&!have.has(r.id)){ RECORDS.push(r); have.add(r.id); n++; } });
      save(); renderNav(); renderHome(); if(curSec)renderList();
      toast('已导入 '+n+' 条 ✓');
    }catch(err){ toast('文件格式不正确'); }
  };
  inp.click();
}
function clearAll(){
  if(!confirm('确定清空全部 '+RECORDS.length+' 条记录？此操作不可恢复！'))return;
  RECORDS=[]; save(); renderNav(); renderHome(); if(curSec)renderList(); closeSheet(); toast('已清空');
}

/* ===================== 弹窗控制 ===================== */
function openSheet(){ document.getElementById('mask').classList.add('show'); document.getElementById('sheet').classList.add('show'); }
function closeSheet(){ document.getElementById('mask').classList.remove('show'); document.getElementById('sheet').classList.remove('show'); }
function closeTemp(){ closeSheet(); }

/* ===================== 移动端侧栏 ===================== */
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('scrim').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrim').classList.remove('show'); }

/* ===================== Toast ===================== */
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

/* ===================== 天气（可选，失败静默） ===================== */
function fetchWeather(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const {latitude,longitude}=pos.coords;
      const url=`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m`;
      const r=await fetch(url); const j=await r.json();
      if(j&&j.current&&j.current.temperature_2m!=null){ window.__weather={temp:j.current.temperature_2m}; renderReminders(); }
    }catch(e){}
  },()=>{},{timeout:6000});
}

/* ===================== 初始化 ===================== */
function init(){
  renderNav(); renderHome(); renderDate();
  fetchWeather();
  document.getElementById('fab').onclick=()=>{ if(!curSec){ toast('先在左侧选择一个板块'); openSidebar(); return; } openEditor(curSec,null); };
  document.getElementById('openSet').onclick=openSettings;
  document.getElementById('hamb').onclick=openSidebar;
  document.getElementById('scrim').onclick=closeSidebar;
  document.getElementById('mask').onclick=closeSheet;
  document.getElementById('sheetClose').onclick=closeSheet;
  bindPickerFoot();
  // PWA
  if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }
}
init();
</script>
